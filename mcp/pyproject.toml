[project]
name = "binggo-mcp"
version = "0.1.0"
description = "Private local MCP server for Binggo dashboard (stdio → http://127.0.0.1:8787)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.28.0",
  "httpx>=0.27.0",
]

[project.scripts]
binggo-mcp = "binggo_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["binggo_mcp*"]
