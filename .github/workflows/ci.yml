name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install Python deps
        run: python -m pip install -r requirements-dev.txt

      - name: Build frontend (for static hosting tests)
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Pytest
        run: python -m pytest tests/ -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Test and build
        working-directory: web/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/static/dist
          retention-days: 3

  e2e:
    needs: [frontend]
    runs-on: ubuntu-latest
    env:
      BINGGO_E2E: "1"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install Python deps
        run: python -m pip install -r requirements-dev.txt

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/static/dist

      - name: Install frontend deps and Playwright Chromium
        working-directory: web/frontend
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Playwright smoke
        working-directory: web/frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/frontend/playwright-report/
            web/frontend/test-results/
          retention-days: 7
